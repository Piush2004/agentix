[pytest]
# These 17 test files import modules (core.services.agent_communication_bus,
# core.services.agent_registry, core.services.context_builder,
# core.agents.data_quality, core.agents.dataset_understanding,
# core.services.decision_engine, core.agents.domain_detection,
# core.services.intent_router, core.services.knowledge_memory,
# core.services.multi_agent_collaboration, core.agents.privacy_agent,
# core.services.real_ai_analyst, core.services.reasoning_engine,
# core.services.recommendation_engine, core.services.semantic_search,
# core.agents.workflow_planner) that do not exist anywhere in this codebase -
# verified by search, not just import failure. They are dead legacy tests
# for a much larger multi-agent/knowledge-graph architecture that was never
# built (or was scrapped) in favor of the current 9-stage pipeline in
# core/agents/pipeline_agents.py. Left in place (not deleted) in case that
# work resumes, but ignored so a single missing-module error doesn't abort
# collection of the entire suite, which previously made `pytest` report
# "17 errors during collection" and run zero of the real, passing tests.
# tests/test_approval_api.py: same situation - tests a human-in-the-loop
# /api/v1/approval/* API that has no route registered anywhere in this
# codebase (verified by search). Ignored rather than deleted for the same
# reason as the block above.
#
# tests/stress_test.py: not a pytest test at all - a standalone script run
# directly (`python tests/stress_test.py`) whose `test_pipeline_on_dataset`
# function takes required positional args. pytest's name-based collection
# still picks it up as a test and then errors trying to call it with no
# arguments; ignoring it here lets it keep working as the standalone script
# it's meant to be without breaking `pytest` collection.
addopts =
    --ignore=tests/test_approval_api.py
    --ignore=tests/stress_test.py
    --ignore=tests/test_agent_bus.py
    --ignore=tests/test_agent_registry.py
    --ignore=tests/test_context_builder.py
    --ignore=tests/test_data_quality.py
    --ignore=tests/test_dataset_processor.py
    --ignore=tests/test_dataset_understanding.py
    --ignore=tests/test_decision_engine.py
    --ignore=tests/test_domain_detection.py
    --ignore=tests/test_intent_router.py
    --ignore=tests/test_knowledge_memory.py
    --ignore=tests/test_multi_agent_collaboration.py
    --ignore=tests/test_privacy_agent.py
    --ignore=tests/test_real_ai_analyst.py
    --ignore=tests/test_reasoning_engine.py
    --ignore=tests/test_recommendation_engine.py
    --ignore=tests/test_semantic_search.py
    --ignore=tests/test_workflow_planner.py
